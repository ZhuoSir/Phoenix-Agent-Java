<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phoenix 智能体平台 · 整体架构</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:   #ffffff;
    --color-paper-2: #f4f7fb;
    --color-ink:     #1f2937;
    --color-muted:   #5b6b80;
    --color-soft:    #8a919c;
    --color-accent:  #2563eb;
    --color-accent-tint: rgba(37,99,235,0.10);
    --color-link:    #0e7490;
    --color-rule:    rgba(31,41,55,0.14);
    --font-sans:  "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    --font-serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
    --font-mono:  ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 32px;
  }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--color-muted);
    margin-bottom: 8px;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: 28px;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .sub { font-size: 12px; color: var(--color-muted); margin-bottom: 20px; }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ARCHITECTURE · 整体架构</p>
    <h1>Phoenix 企业级智能体平台 · 整体架构</h1>
    <p class="sub">工程底座 phoenix-common / tool / codegen 与 api·core·rest 三层结构未列为独立节点；NL2SQL 十节点工作流另见流程图。</p>

        <marker id="phx-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>

        <marker id="phx-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
