server:
  port: 8066
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
spring:
  output:
    ansi:
      enabled: always
  profiles:
    active: test
  banner:
    location: classpath:phoenix-banner.txt
  main:
    web-application-type: reactive
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-flex:
  # Mapper XML 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 别名包扫描路径
  type-aliases-package: com.phoenix
  # MyBatis 原生配置（如日志、缓存等）
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  # MyBatis-Flex 全局配置
  global-config:
    # 逻辑删除配置
    logic-delete-column: del_flag
    normal-value-of-logic-delete: 0 # 未删除
    deleted-value-of-logic-delete: 1 # 已删除
    # 乐观锁配置
    version-column: version
    # 是否打印 Banner
    print-banner: true
# 日志配置
logging:
  level:
    com.alibaba.cloud.ai.dataagent.service: debug
    com.alibaba.cloud.ai.dataagent.workflow.node: debug
    com.alibaba.cloud.ai.mapper: debug
    org.springframework.jdbc: debug

# ===== 超长附件分批（BL-67 / T-01）=====
# 说明：以下为**默认值**，环境变量可覆盖（Spring 宽松绑定：短横线去掉，
# 如 attachment-chunk-size → PHOENIX_AGENT_CHAT_ATTACHMENTCHUNKSIZE）
phoenix:
  agent:
    chat:
      # 触发分批的字符阈值（原"截断阈值"语义已改为"分批阈值"）
      attachment-max-extract-chars: 24000
      # 抽取安全上限（防 OOM）：只有超过它才真截断并提示
      attachment-safe-max-chars: 2000000
      # 每批字符数
      attachment-chunk-size: 6000
      # 块间重叠字符（避免语义切断）
      attachment-chunk-overlap: 300
      # 最大批数（护栏）
      attachment-max-chunks: 20
      # 单批模型调用超时（秒）
      attachment-chunk-timeout-seconds: 60
