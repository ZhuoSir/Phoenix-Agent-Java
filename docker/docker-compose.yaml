name: phoenix-release

services:
  postgres:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: phoenix
      POSTGRES_PASSWORD: ${PG_PASSWORD:-phoenix}
      POSTGRES_DB: phoenix
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix -d phoenix"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrator:
    image: ${PGCLIENT_IMAGE:-postgres:16-alpine}
    environment:
      PGHOST: postgres
      PGUSER: phoenix
      PGPASSWORD: ${PG_PASSWORD:-phoenix}
      PGDATABASE: phoenix
    volumes:
      - ./init:/init:ro
      - ../sql:/sql:ro
      - ../releases:/releases:ro
    entrypoint: ["/bin/sh", "/init/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: phoenix-backend:${IMAGE_TAG:-v1.2.0}
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        JRE_BASE_IMG: ${JRE_BASE_IMG:-eclipse-temurin:21-jre-jammy}
        JAVA_BIN: ${JAVA_BIN:-java}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/phoenix?stringtype=unspecified&useGeneratedKeys=true
      SPRING_DATASOURCE_USERNAME: phoenix
      SPRING_DATASOURCE_PASSWORD: ${PG_PASSWORD:-phoenix}
      SPRING_DATA_REDIS_HOST: redis
      JETCACHE_REMOTE_DEFAULT_URI: redis://@redis:6379/8
      # BL-19：会话产物与文件登记根（uploads 卷内，随卷备份；workspace 经扫描器捕获）
      PHOENIX_AGENT_WORKSPACE_ROOT: /app/uploads/agent-workspace
      PHOENIX_AGENT_FILES_ROOT: /app/uploads
      PHOENIX_AGENT_TURN_TIMEOUT_SECONDS: ${PHOENIX_AGENT_TURN_TIMEOUT_SECONDS:-0}
      PHOENIX_AGENT_TURN_IDLE_TIMEOUT_SECONDS: ${PHOENIX_AGENT_TURN_IDLE_TIMEOUT_SECONDS:-600}
      PHOENIX_AGENT_TURN_FLUSH_SECONDS: ${PHOENIX_AGENT_TURN_FLUSH_SECONDS:-5}
      PHOENIX_AGENT_TURN_BUFFER_FRAMES: ${PHOENIX_AGENT_TURN_BUFFER_FRAMES:-2000}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70 -XX:+UseContainerSupport}
      TZ: Asia/Shanghai
    volumes:
      - applogs:/app/logs
      - uploads:/app/uploads   # FileStorageProperties path=./uploads 相对 WORKDIR（头像/产物图片持久化）
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8066/echo/ok || wget -qO- http://localhost:8066/echo/ok"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 30s

  migrator-post:
    image: ${PGCLIENT_IMAGE:-postgres:16-alpine}
    environment:
      PGHOST: postgres
      PGUSER: phoenix
      PGPASSWORD: ${PG_PASSWORD:-phoenix}
      PGDATABASE: phoenix
    volumes:
      - ./init:/init:ro
      - ../releases:/releases:ro
    entrypoint: ["/bin/sh", "/init/post_start.sh"]
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

  nginx:
    image: phoenix-frontend:${IMAGE_TAG:-v1.2.0}
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        NGINX_BASE_IMG: ${NGINX_BASE_IMG:-nginx:1.27-alpine}
    ports:
      - "${PHOENIX_HTTP_PORT:-9080}:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || wget -qO- http://localhost/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  applogs:
  uploads:
