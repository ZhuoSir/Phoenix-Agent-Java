server {
    listen 80;
    server_name _;

    client_max_body_size 50m;          # 技能 ZIP 上传（R-09）

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json text/plain;

    root /usr/share/nginx/html;
    index index.html;

    # 历史客户端止血（BUG-40/33 遗留页）：/api/api/* 直接 410。
    # EventSource 语义：5xx 无限重试、4xx 永久终止——必须 410 才能掐死残留旧页的重连风暴。
    # 新代码已无此路径（dist 双前缀=0）。确认无旧客户端后可移除本块。
    location ^~ /api/api/ {
        return 410;
    }

    # BL-18（BUG-33 根治）：前端直出后端真实路径，这里只按前缀透传，不再剥层折叠
    location /api {
        proxy_pass http://backend:8066;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;  # BUG-55：SSE 长工具任务静默期容忍（配合心跳双保险）
        proxy_send_timeout 900s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 裸域（platform/auth 后端映射不带 /api）
    # BUG-56 v2：SPA 登录页路由与平台登录 API **同路径靠 method 区分**（GET=页面导航 / POST=API）。
    # 一版豁免误用 exact+try_files 一刀切，把 POST /auth/login 也发成了 HTML——前台登录当场挂掉，
    # 已按方法分流修正：GET 导航内部重定向到 index.html；其余方法原样代理后端。
    location = /auth/login {
        if ($request_method = GET) { rewrite ^ /index.html last; }
        proxy_pass http://backend:8066;
        proxy_http_version 1.1;
        proxy_read_timeout 900s;
        proxy_set_header Host $host;
    }
    location = /auth/register {
        if ($request_method = GET) { rewrite ^ /index.html last; }
        proxy_pass http://backend:8066;
        proxy_http_version 1.1;
        proxy_read_timeout 900s;
        proxy_set_header Host $host;
    }

    location ~ ^/(platform|auth) {
        proxy_pass http://backend:8066;
        proxy_http_version 1.1;
        proxy_read_timeout 900s;  # BUG-55 同上
        proxy_set_header Host $host;
    }

    location /echo {                      # 健康探针透传（verify.sh [4]）
        proxy_pass http://backend:8066;
    }

    location /uploads {                   # dev 代理同源语义（不折叠）
        proxy_pass http://backend:8066;
    }

    # BUG-39：index.html 永不缓存（发布新包后浏览器不再吃旧 bundle）；
    # 带 hash 的构建产物（js/css/img 目录）长缓存 + immutable
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # T-08（chat-attachment-understanding）：mobile-ui 挂 /m/（SPA history；^~ 前缀优先，避免与下方正则冲突）
    location = /m {
        return 301 /m/;
    }

    location ^~ /m/ {
        alias /usr/share/nginx/html-mobile/;
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /m/index.html;
    }

    location ~* ^/(js|css|assets)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;   # SPA history
    }


}
