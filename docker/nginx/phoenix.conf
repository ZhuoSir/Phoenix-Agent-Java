server {
    listen 80;
    server_name _;

    client_max_body_size 50m;          # 技能 ZIP 上传（R-09）

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json text/plain;

    root /usr/share/nginx/html;
    index index.html;

    # BUG-33：前端生产包 URL 为双重前缀 /api/api/*（axios baseURL=/api + 代码自带 /api）。
    # 仅折叠 /api/api/* → /api/*；标准 /api/* 原样透传。
    location ^~ /api/api/ {
        rewrite ^/api/api/(.*)$ /api/$1 break;
        proxy_pass http://backend:8066;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://backend:8066;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /echo {                      # 健康探针透传（verify.sh [4]）
        proxy_pass http://backend:8066;
    }

    location /uploads {                   # dev 代理同源语义（不折叠）
        proxy_pass http://backend:8066;
    }

    location / {
        try_files $uri $uri/ /index.html;   # SPA history
    }

    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
