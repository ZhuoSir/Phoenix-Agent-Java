server {
    listen 80;
    server_name _;

    client_max_body_size 50m;          # 技能 ZIP 上传（R-09）

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json text/plain;

    root /usr/share/nginx/html;
    index index.html;

    # BUG-33：完全复刻 vite dev proxy 的 rewrite 语义——凡 /api/* 一律剥一层再转后端
    # （浏览器 URL = baseURL(/api) + 代码路径；代码里两种写法并存：
    #   带/api前缀的域(login/agent/model...) → 实际双前缀 /api/api/*  → 剥一层 → /api/* ✓
    #   不带前缀的 platform 域 → 实际单前缀 /api/platform/* → 剥一层 → /platform/* ✓）
    location ^~ /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8066;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /echo {                      # 健康探针透传（verify.sh [4]）
        proxy_pass http://backend:8066;
    }

    location /uploads {                   # dev 代理同源语义（不折叠）
        proxy_pass http://backend:8066;
    }

    location / {
        try_files $uri $uri/ /index.html;   # SPA history
    }

    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
